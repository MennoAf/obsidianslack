# Tag Generation Rules for ObsidianSlack
# Customize these rules to match your workflow and commonly used sites

# Domain-based tagging
# Maps URL domains to tags that will be added to notes containing those URLs
domains:
  # Developer platforms
  github.com:
    - dev/github
    - code
  stackoverflow.com:
    - dev/stackoverflow
    - code
  stackexchange.com:
    - dev/stackexchange
    - code
  gitlab.com:
    - dev/gitlab
    - code
  bitbucket.org:
    - dev/bitbucket
    - code
  npmjs.com:
    - dev/npm
    - code
  pypi.org:
    - dev/pypi
    - code/python

  # News sites
  theverge.com:
    - news/tech
    - source/theverge
  cnn.com:
    - news/general
    - source/cnn
  bbc.com:
    - news/general
    - source/bbc
  nytimes.com:
    - news/general
    - source/nytimes
  techcrunch.com:
    - news/tech
    - startups
    - source/techcrunch
  arstechnica.com:
    - news/tech
    - source/arstechnica
  wired.com:
    - news/tech
    - source/wired

  # Social & Media
  youtube.com:
    - video
    - source/youtube
  youtu.be:
    - video
    - source/youtube
  reddit.com:
    - social/reddit
  twitter.com:
    - social/twitter
  x.com:
    - social/twitter
  linkedin.com:
    - social/linkedin
    - professional

  # Content platforms
  medium.com:
    - articles
    - source/medium
  substack.com:
    - articles
    - newsletter
    - source/substack
  dev.to:
    - articles
    - code
    - source/devto

  # Research & Academic
  arxiv.org:
    - research
    - academic
    - source/arxiv
  scholar.google.com:
    - research
    - academic
  researchgate.net:
    - research
    - academic

  # Productivity & Collaboration
  docs.google.com:
    - docs
    - collaboration
  notion.so:
    - docs
    - source/notion
  figma.com:
    - design
    - source/figma
  miro.com:
    - design
    - collaboration
  trello.com:
    - project-management
    - tasks
  asana.com:
    - project-management
    - tasks

  # Documentation
  readthedocs.io:
    - docs
    - technical
  docs.python.org:
    - docs
    - code/python
  developer.mozilla.org:
    - docs
    - code/javascript
    - web

